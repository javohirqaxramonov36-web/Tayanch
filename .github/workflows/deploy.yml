# main'ga har push'da saytni qurib, GitHub Pages'ga joylaydi.
# Ishlashi uchun repo Settings → Pages → Source: "GitHub Actions" bo'lishi kerak.
name: Saytni joylash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTRO_TELEMETRY_DISABLED: 1

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Taqiqlangan fayl yoki kalit qiymati repoda bo'lsa, build va joylash to'xtaydi (docs/kontent-siyosati.md).
      - name: Repo tekshiruvi
        run: node scripts/repo-tekshir.mjs
      # Hisob (Supabase): faqat ochiq qiymatlar, repo Settings → Secrets and variables → Actions → Variables.
      # Berilmasa sayt baribir quriladi, hisob sahifalari "hali ishlamaydi" deydi (docs/lokal-ish-tartibi.md).
      - uses: withastro/action@v6
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
