# Tayanch'ning 4 bo'limi.
# holat: "ochiq" bo'lsa menyuda ko'rinadi va kartada havola bo'ladi;
#        "tez-orada" bo'lsa kartada faqat "tez orada" yozuvi chiqadi.
# Bo'lim sahifasi qurilib tasdiqlangandan keyingina "ochiq" ga o'tkaziladi.

- slug: top-admission
  nomi: Top Admission
  tavsif: "Chet elda o'qish uchun universitet tanlashdan qabul xatigacha yo'riqnoma."
  holat: tez-orada

- slug: ielts
  nomi: IELTS
  tavsif: "IELTS imtihoniga mustaqil tayyorgarlik: Listening, Reading, Writing, Speaking."
  holat: tez-orada

- slug: sat
  nomi: SAT
  tavsif: "Digital SAT tayyorgarligi: Reading & Writing va Math, vaqtni boshqarish, xatolar tahlili."
  holat: ochiq

- slug: eyuf
  nomi: El-Yurt Umidi
  tavsif: "El-Yurt Umidi jamg'armasi stipendiyasiga tayyorgarlik: bosqichlar xaritasi."
  holat: tez-orada
