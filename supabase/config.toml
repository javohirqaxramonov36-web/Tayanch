# Tayanch: Supabase Auth sozlamalari (P03). Faqat ochiq qiymatlar; kalit va parol bu yerga yozilmaydi.
# Qo'llash: `supabase config diff --remote=<ref>` (ko'rish), so'ng `supabase config push --remote=<ref>`.
# Faylda yo'q sozlamalar Supabase'da o'zgarmaydi (CLI hujjati). Batafsil: supabase/README.md.
project_id = "tayanch"

[auth]
# Havolada redirectTo bo'lmasa shu manzil ishlatiladi.
site_url = "https://javohirqaxramonov36-web.github.io/Tayanch/uz/hisob/kirish/"
# Hisob 1-qavatda (/uz/hisob/, 2026-11-09). Tasdiqlash xati -> kirish/ (ba'zan ?keyin= bilan),
# parol tiklash -> parol-tiklash/. Lokal: astro dev/preview 4321.
# Eski /uz/sat/hisob/ manzillari ham qoladi: ular yangi joyga yo'naltiradi (yangi kod deploy bo'lguncha ham ishlaydi).
additional_redirect_urls = [
  "https://javohirqaxramonov36-web.github.io/Tayanch/uz/hisob/kirish/",
  "https://javohirqaxramonov36-web.github.io/Tayanch/uz/hisob/kirish/**",
  "https://javohirqaxramonov36-web.github.io/Tayanch/uz/hisob/parol-tiklash/",
  # Google (P03B): redirectTo query'siz, aniq shu manzil (keyin sessionStorage'da). Qo'llangan 2026-11-09.
  "https://javohirqaxramonov36-web.github.io/Tayanch/uz/hisob/callback/",
  "https://javohirqaxramonov36-web.github.io/Tayanch/uz/sat/hisob/kirish/**",
  "https://javohirqaxramonov36-web.github.io/Tayanch/uz/sat/hisob/parol-tiklash/",
  "http://localhost:4321/Tayanch/**",
]
# Formadagi hisobSozlama.parolMinUzunlik bilan bir xil.
minimum_password_length = 8

# Google provider (client ID, secret) bu faylda emas: Dashboard → Authentication → Providers → Google
# (secret repoga tushmasligi uchun). Faylda yo'q sozlama config push'da o'zgarmaydi.

[auth.email]
# Email tasdiqlash majburiy.
enable_confirmations = true

# Edge Function'lar (inPAY to'lovi, PR #62; supabase/README.md 10-bo'lim). `supabase functions deploy` o'qiydi.
# inpay-webhook: inPAY Supabase JWT yubormaydi, so'rov X-Inpay-Signature imzosi bilan tekshiriladi.
[functions.inpay-webhook]
verify_jwt = false

# tolov-yaratish: foydalanuvchi kod ichida auth.getUser bilan tekshiriladi.
[functions.tolov-yaratish]
verify_jwt = false

# inpay-holat: foydalanuvchi kod ichida auth.getUser bilan tekshiriladi; faqat o'z to'lovi.
[functions.inpay-holat]
verify_jwt = false

# inpay-muvofiqlash (P21): Supabase Cron JWT yubormaydi; X-Cron-Secret (MUVOFIQLASH_SECRET) kod ichida tekshiriladi.
[functions.inpay-muvofiqlash]
verify_jwt = false
